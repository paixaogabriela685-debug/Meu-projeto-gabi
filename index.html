<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Chocolate Lab 🍫</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">🍫 Chocolate Lab</div>
        <nav>
            <ul>
                <li><a href="#">Início</a></li>
                <li><a href="#">Receitas</a></li>
                <li><a href="#">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <section class="description-section">
        <h2>O laboratório mais doce da web</h2>
        <p>
            Bem-vindo ao <strong>Chocolate Lab</strong>! Aqui você descobre se o seu doce favorito 
            é um suave chocolate ao leite ou um intenso chocolate amargo. 
            Basta inserir a porcentagem de cacau abaixo.
        </p>
    </section>

    <div class="container">
        <h1>Analisador 🧪</h1>
        <input type="number" id="valorCacau" placeholder="% de cacau">
        <button id="btnVerificar">Analisar</button>
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
